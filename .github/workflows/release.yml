name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write         # create GitHub Releases + upload assets
  packages: write         # push Docker image to ghcr.io (GitHub Packages)

jobs:
  # ── 1. Build binaries + GitHub Release ─────────────────────────────────────
  release:
    name: Build & Release Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Set version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build all platforms
        env:
          LDFLAGS: -s -w -X github.com/rashid1125/launchsafe/cmd.Version=${{ steps.version.outputs.VERSION }}
        run: |
          mkdir -p dist
          GOOS=linux   GOARCH=amd64  go build -ldflags="$LDFLAGS" -o dist/launchsafe-linux-amd64       .
          GOOS=linux   GOARCH=arm64  go build -ldflags="$LDFLAGS" -o dist/launchsafe-linux-arm64       .
          GOOS=darwin  GOARCH=amd64  go build -ldflags="$LDFLAGS" -o dist/launchsafe-darwin-amd64      .
          GOOS=darwin  GOARCH=arm64  go build -ldflags="$LDFLAGS" -o dist/launchsafe-darwin-arm64      .
          GOOS=windows GOARCH=amd64  go build -ldflags="$LDFLAGS" -o dist/launchsafe-windows-amd64.exe .

      - name: Create checksums
        working-directory: dist
        run: sha256sum * > checksums.txt && cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LaunchSafe ${{ steps.version.outputs.VERSION }}
          body: |
            ## Install

            **Option 1 — Go install (requires Go 1.22+):**
            ```bash
            go install github.com/rashid1125/launchsafe@${{ steps.version.outputs.VERSION }}
            ```

            **Option 2 — Download binary** (pick your platform below):
            ```bash
            # Linux / macOS
            chmod +x launchsafe-*
            sudo mv launchsafe-* /usr/local/bin/launchsafe
            launchsafe version
            ```

            **Option 3 — Docker (GitHub Packages):**
            ```bash
            docker pull ghcr.io/rashid1125/launchsafe:${{ steps.version.outputs.VERSION }}
            docker run --rm -v "$(pwd):/project" ghcr.io/rashid1125/launchsafe check --path /project
            ```

            **Option 4 — One-liner install script:**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/rashid1125/launchsafe/main/install.sh | bash
            ```

            **Verify checksum:**
            ```bash
            sha256sum -c checksums.txt
            ```
          files: |
            dist/launchsafe-linux-amd64
            dist/launchsafe-linux-arm64
            dist/launchsafe-darwin-amd64
            dist/launchsafe-darwin-arm64
            dist/launchsafe-windows-amd64.exe
            dist/checksums.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ── 2. Build & push Docker image to GitHub Packages (ghcr.io) ──────────────
  docker:
    name: Publish Docker Image to GitHub Packages
    runs-on: ubuntu-latest
    needs: release          # only publish Docker if binaries succeeded

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rashid1125/launchsafe
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up Docker Buildx (multi-platform)
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
